<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto&family=Quicksand&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary p-3">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">TIENDA</span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="card p-4 shadow">

            <h2 class="mb-4">Agregar Producto</h2>

            <input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre">

            <input type="number" id="precio" class="form-control mb-3" placeholder="Precio">

            <input type="number" id="stock" class="form-control mb-3" placeholder="Stock">

            <button class="btn btn-danger" onclick="agregarProducto()">
                Guardar
            </button>
        </div>

        <div class="mt-5">
            <h2>Productos</h2>

            <table class="table table-bordered table-striped mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                    </tr>
                </thead>

                <tbody id="tablaProductos"></tbody>
            </table>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
